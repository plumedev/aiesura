name: Keep Supabase Alive

on:
  schedule:
    # S'exécute tous les 3 jours à minuit UTC (bien avant la limite de 7 jours)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permet de déclencher le workflow manuellement depuis GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Secrets introuvables. Vérifiez que SUPABASE_URL et SUPABASE_KEY (ou SUPABASE_ANON_KEY) sont bien configurés dans GitHub."
            exit 1
          fi

          echo "Envoi d'un ping à l'API Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/")

          echo "Statut HTTP retourné: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Ping réussi ! Supabase reste actif."
          else
            echo "::warning::Statut inattendu ($HTTP_STATUS), mais la requête d'activité a bien été transmise à Supabase."
          fi
