name: Keep Supabase Alive

on:
  schedule:
    # S'exécute tous les 3 jours à minuit UTC (bien avant la limite de 7 jours)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permet de déclencher le workflow manuellement depuis GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::Les secrets SUPABASE_URL ou SUPABASE_ANON_KEY ne sont pas configurés dans GitHub Secrets."
            exit 1
          fi

          echo "Envoi d'un ping à l'API Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")

          echo "Statut HTTP retourné: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Ping réussi ! Supabase reste actif."
          else
            echo "::warning::Statut inattendu ($HTTP_STATUS), mais la requête d'activité a bien été transmise à Supabase."
          fi
