name: Keep Supabase Alive

on:
  schedule:
    # S'exécute tous les 3 jours à minuit UTC (bien avant la limite de 7 jours)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permet de déclencher le workflow manuellement depuis GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          RAW_KEY: ${{ secrets.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$RAW_URL" ] || [ -z "$RAW_KEY" ]; then
            echo "::error::Secrets introuvables. Vérifiez que SUPABASE_URL et SUPABASE_KEY sont bien configurés dans GitHub Secrets."
            exit 1
          fi

          # Nettoyer les guillemets éventuels (" ou ') et les espaces copiés par erreur
          URL=$(echo "$RAW_URL" | sed -e 's/^[[:space:]"'\''"]*//' -e 's/[[:space:]"'\''"]*$//' -e 's/\/$//')
          KEY=$(echo "$RAW_KEY" | sed -e 's/^[[:space:]"'\''"]*//' -e 's/[[:space:]"'\''"]*$//')

          # S'assurer du préfixe https://
          if [[ ! "$URL" =~ ^https?:// ]]; then
            URL="https://$URL"
          fi

          TARGET_ENDPOINT="${URL}/rest/v1/"
          echo "Envoi d'un ping à l'API Supabase vers $TARGET_ENDPOINT..."

          HTTP_STATUS=$(curl -s -S -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$TARGET_ENDPOINT" 2>&1) || CURL_EXIT=$?

          if [ -n "$CURL_EXIT" ] && [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Échec de la commande curl (Code d'erreur curl: $CURL_EXIT). Vérifiez la valeur de SUPABASE_URL dans GitHub Secrets."
            echo "Détails: $HTTP_STATUS"
            exit 1
          fi

          echo "Statut HTTP retourné: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Ping réussi ! Supabase reste actif."
          else
            echo "::warning::Statut inattendu ($HTTP_STATUS), mais la requête d'activité a bien été transmise à Supabase."
          fi
